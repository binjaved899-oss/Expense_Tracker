version: '3.9'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=./data/expense-tracker.json
      - SESSION_SECRET=local-dev-replace-in-prod-2024-secret
    volumes:
      - app_data:/app/data
    restart: unless-stopped

volumes:
  app_data:
